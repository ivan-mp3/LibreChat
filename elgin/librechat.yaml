# Configuracao do LibreChat da Elgin.
#
# Este arquivo NAO fica na raiz de proposito: o .dockerignore do LibreChat
# ignora "librechat*" na raiz, entao um librechat.yaml ali nunca entraria na
# imagem Docker e sumiria em silencio. Por isso ele vive em elgin/ e o servico
# do Render aponta CONFIG_PATH=/app/elgin/librechat.yaml.

version: 1.3.17
cache: true

interface:
  # Seletor escondido. Com enforce: true nenhum outro modelo e utilizavel,
  # entao o seletor so mostrava opcoes que nao funcionam (OpenAI, My Agents).
  # E configuracao global: vale para admin tambem.
  modelSelect: false

modelSpecs:
  # enforce: so os specs desta lista ficam disponiveis. Como ha um unico spec,
  # o seletor do topo mostra apenas o PDP Elgin. Para liberar outros modelos
  # depois, basta trocar para false.
  enforce: true
  prioritize: true
  list:
    - name: pdp-elgin
      label: PDP Elgin
      default: true
      # A descricao aparece na tela inicial de cada conversa nova
      # (showOnLanding), que e exatamente quando a pessoa vai anexar o
      # briefing. Por isso o aviso de formato mora aqui.
      description: >-
        Cria PDPs da Elgin a partir do briefing e da ficha tecnica.
        Anexe PDF, Word, Excel ou texto — PowerPoint nao e lido:
        exporte para PDF antes.
      showOnLanding: true
      iconURL: /assets/elgin-e.png
      preset:
        # O endpoint e declarado de proposito. A documentacao diz que ele e
        # inferido a partir do agent_id, e o servidor realmente infere
        # (resolveModelSpecEndpoint). Mas o cliente recebe o spec sem o campo
        # e acaba nao mandando endpoint nenhum na requisicao, entao a
        # comparacao undefined !== "agents" derruba a conversa com
        # "Model spec mismatch". Declarar resolve dos dois lados.
        endpoint: agents
        agent_id: agent_JSwSut8mLi55_cX3gjU45

webSearch:
  # Keenable funciona sem chave de API; rerankerType "none" evita exigir uma
  # chave de Jina ou Cohere. Trocar por serper ou tavily e so mudar estas
  # tres linhas e adicionar a chave correspondente no Render.
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  # Sem reranker, o que o scraper trouxer vai inteiro para o modelo — e foi
  # assim que uma unica busca somou 58 mil tokens no orcamento de contexto.
  # Menos paginas, menos texto despejado. O padrao e 8.
  keenableSearchOptions:
    maxResults: 4

# Base de Conhecimento Elgin, publicada pelo app antigo (elgin-copy).
#
# Definido aqui, e nao criado por usuario, para aparecer para todo mundo sem
# depender de compartilhamento — o admin ja tinha criado uma copia pessoal,
# que pode ser removida depois que esta entrar.
#
# O servidor faz descoberta de OAuth e registro dinamico de cliente, entao
# nao e preciso declarar authorization_url, token_url, client_id nem secret:
# o LibreChat se registra sozinho.
#
# ATENCAO: os metadados do servidor declaram
# grant_types_supported: ["authorization_code", "refresh_token"] — nao ha
# client_credentials. Isso significa que NAO existe credencial de servico:
# cada pessoa autentica a sua, uma vez, com a senha de equipe.
mcpServers:
  base-elgin:
    type: streamable-http
    url: https://elgin-copy.onrender.com/mcp
    # O nome tem de bater com o que o admin ja conectou: os tokens ficam
    # gravados com o identificador "mcp:base-elgin".
    title: Base Elgin
    # Nao inicializa no boot: o servidor exige autenticacao por usuario, e
    # tentar conectar sem token so geraria erro no log a cada deploy.
    startup: false
